<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 B · 瑞士现代网格 — 警校学习规划</title>
<style>
  :root { --bg:#fafafa; --fg:#09090b; --muted:#71717a; --line:#e4e4e7; --accent:#ec4899; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Helvetica Neue","Noto Sans SC","PingFang SC",sans-serif; background:var(--bg); color:var(--fg); }
  .banner { background:#09090b; color:#fff; text-align:center; padding:10px; font-size:12px; letter-spacing:.08em; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 24px; }
  header { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; align-items:end; padding:40px 0 24px; border-bottom:3px solid var(--fg); }
  .logo { grid-column:1/6; font-size:26px; font-weight:800; letter-spacing:-.02em; }
  nav { grid-column:6/13; text-align:right; }
  nav a { margin-left:20px; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); text-decoration:none; }
  nav a:hover, nav a.on { color:var(--fg); }
  nav a.on { box-shadow:inset 0 -3px 0 var(--accent); }
  .hero { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; padding:64px 0; border-bottom:1px solid var(--line); }
  .hero .no { grid-column:1/3; font-size:13px; color:var(--muted); }
  .hero h1 { grid-column:3/11; font-size:clamp(34px,6vw,64px); font-weight:800; line-height:1.1; letter-spacing:-.03em; }
  .hero h1 em { font-style:normal; color:var(--accent); }
  .hero p { grid-column:3/9; margin-top:20px; color:var(--muted); font-size:15px; line-height:1.8; }
  .list { padding:16px 0 64px; }
  .row { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; align-items:baseline; padding:22px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; transition:background .15s; }
  .row:hover { background:#f0f0f1; }
  .row .idx { grid-column:1/2; font-size:13px; color:var(--muted); }
  .row h3 { grid-column:2/9; font-size:18px; font-weight:700; letter-spacing:-.01em; }
  .row .cat { grid-column:9/11; font-size:12px; color:var(--muted); }
  .row .arrow { grid-column:11/13; text-align:right; font-weight:800; color:var(--accent); }
  footer { border-top:3px solid var(--fg); padding:24px; font-size:12px; color:var(--muted); text-align:center; }
  @media (max-width:720px){ .logo,.hero h1,.hero p{grid-column:1/13;} nav{grid-column:1/13;text-align:left;margin-top:12px;} nav a{margin:0 14px 0 0;} .row h3{grid-column:2/13;} .row .cat,.row .arrow{display:none;} }
</style>
</head>
<body>
  <div class="banner">风格预览 · 方案 B：瑞士现代网格（设计系统推荐，非线上页面）</div>
  <div class="wrap">

    </header>
    <div class="hero">
      <div class="no">№ 01<br>2026</div>
      <h1>四年规划，<br>精确到<em>每个学期</em>。</h1>
      <p>大学规划与公安联考指南。理性拆解路径，拒绝鸡汤——网格、秩序、可执行。</p>
    </div>
    <div class="list">
      <a class="row" href="#"><span class="idx">01</span><h3>郑州警察学院网络安全与执法专业·大学四年规划指南</h3><span class="cat">大学规划</span><span class="arrow">→</span></a>
      <a class="row" href="#"><span class="idx">02</span><h3>公安联考四年规划指南</h3><span class="cat">公安联考</span><span class="arrow">→</span></a>
      <a class="row" href="#"><span class="idx">03</span><h3>公安联考冲刺计划</h3><span class="cat">公安联考</span><span class="arrow">→</span></a>
      <a class="row" href="#"><span class="idx">04</span><h3>零编程基础·专属进阶蓝图</h3><span class="cat">编程</span><span class="arrow">→</span></a>
      <a class="row" href="#"><span class="idx">05</span><h3>数据库原理及应用</h3><span class="cat">编程</span><span class="arrow">→</span></a>
    </div>
  </div>
  <footer>警校学习规划 · 方案 B 预览 · Swiss Modernism 2.0</footer>
</body>
</html>
